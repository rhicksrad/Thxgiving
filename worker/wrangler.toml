# The Thanksgiving site's backend: API, D1 database, R2 photos and live updates. See worker/README.md.
name = "thxgiving"
main = "index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "thxgiving"
database_id = "cc680a6d-d1b7-4377-8475-837ee38d5f4b"

[[r2_buckets]]
binding = "FILES"
bucket_name = "thxgiving-files"

# One Durable Object holds everyone's live connection. SQLite-backed, which is what the free plan allows.
[[durable_objects.bindings]]
name = "LIVE"
class_name = "Live"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Live"]

# SIGNING_SECRET (signs the photo links) is a secret: set by the deploy workflow or `wrangler secret put`, never here.
