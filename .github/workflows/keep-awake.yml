name: Keep Supabase awake

# Supabase pauses a free project after a week with no activity. A tiny read every few days keeps it up
# between holidays. (The file service in worker/ does the same on its own schedule once it's deployed,
# which keeps going even if GitHub turns this off after 60 days without a push.)
on:
  schedule:
    - cron: '23 14 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          url=$(grep -o "https://[a-z0-9]*\.supabase\.co" public/config.js || true)
          key=$(grep -o "sb_publishable_[A-Za-z0-9_-]*" public/config.js || true)
          [ -n "$url" ] || { echo "public/config.js has no Supabase URL yet"; exit 0; }
          curl -fsS -o /dev/null -w "Supabase answered %{http_code}\n" "$url/rest/v1/gatherings?select=id&limit=1" -H "apikey: $key"
